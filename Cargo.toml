[package]
name = "dish"
version = "0.1.0"
edition = "2021"
description = "Dish — a fast GPUI desktop interface for the Pi coding agent"
license = "Apache-2.0"

[dependencies]
gpui-ce = "0.2.2"
gpui_platform = { package = "gpui_ce_platform", version = "0.1.0", features = ["wayland", "x11", "font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
anyhow = "1"
base64 = "0.22"
url = "2"
unicode-segmentation = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ureq = { version = "3.5.0", features = ["rustls"] }
minisign-verify = "0.3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Ler o estilo real do HWND: o backend reporta `Decorations::Server` mesmo
# quando cria a janela sem `WS_CAPTION`, então o relatório não prova nada.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
# Embutir ícone e metadados no dish.exe: sem isso o atalho e a barra de
# tarefas mostram o ícone genérico do Windows.
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
