name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-v1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-v1-${{ hashFiles('Cargo.lock') }}-
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Build release
        run: cargo build --release --locked
      - name: Verify the GUI subsystem
        shell: pwsh
        run: |
          # Um binário de console tem subsystem 3; GUI tem 2 (sem janela de console).
          $bytes = [IO.File]::ReadAllBytes('target/release/dish.exe')
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($subsystem -ne 2) { throw "dish.exe uses subsystem $subsystem, expected GUI (2)" }
          Write-Host 'dish.exe is a GUI-subsystem binary (no console window)'
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # O chocolatey não atualiza o PATH desta sessão.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
                      [Environment]::GetEnvironmentVariable('Path', 'User')
      - name: Build the installer
        shell: pwsh
        run: |
          # O rótulo da versão vive no ci.yml; o Cargo.toml é o fallback.
          $label = (Select-String -Path .github/workflows/ci.yml -Pattern '--version ([0-9][^\s'']*)' |
                    Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $label) {
            $label = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          }
          $numeric = ($label -replace '-alpha\.', '.' -replace '[^0-9.]', '').Split('.')
          while ($numeric.Count -lt 4) { $numeric += '0' }
          $versionNum = ($numeric[0..3] -join '.')
          Write-Host "Dish $label ($versionNum)"
          New-Item -ItemType Directory -Force dist | Out-Null
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $makensis = @(
              "$env:ProgramData\chocolatey\bin\makensis.exe",
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { throw 'makensis não encontrado' }
          Write-Host "makensis: $makensis"
          & $makensis /V2 "/DVERSION=$label" "/DVERSIONNUM=$versionNum" "/DSRCDIR=$PWD" scripts/windows-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis falhou' }
          $installer = Get-Item "dist/dish-$label-windows-x86_64-setup.exe"
          if ($installer.Length -lt 1MB) { throw "Instalador pequeno demais: $($installer.Length) bytes" }
          Write-Host "Instalador: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
      - name: Save Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dish-windows-exe
          path: target/release/dish.exe
          if-no-files-found: error
          retention-days: 14
      - name: Save the Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dish-windows-installer
          path: dist/*-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 14
