name: Windows build

on:
  push:
  workflow_dispatch:
  # Publicar o Release é a única ação que anexa os assets do Windows. Um push
  # (inclusive de tag) só produz artifacts do Actions.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate SignPath configuration
        id: signpath-config
        if: github.event_name == 'release' && vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw 'SIGNPATH_PROJECT_SLUG is set, but SIGNPATH_API_TOKEN is missing.'
          }
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is required when SIGNPATH_PROJECT_SLUG is set."
            }
          }
      - name: Install Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rust-docs
          rustc --version
          cargo --version
      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-v1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-v1-${{ hashFiles('Cargo.lock') }}-
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Resolve the release label
        id: release-version
        # O rótulo é definido uma única vez, no ci.yml; o empacotador lê de lá.
        # Sem esta variável o app se anuncia como "build local".
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python -c "import importlib.util as u; s=u.spec_from_file_location('pw','scripts/package-windows.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print(m.release_version(None))"
          )"
          if [ -z "$version" ]; then
            echo 'DISH_RELEASE_VERSION veio vazio; confira o --version em ci.yml.' >&2
            exit 1
          fi
          echo "DISH_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "label=$version" >> "$GITHUB_OUTPUT"
          numeric="$(
            RELEASE_LABEL="$version" python -c "import importlib.util as u; import os; s=u.spec_from_file_location('pw','scripts/package-windows.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print(m.numeric_version(os.environ['RELEASE_LABEL']))"
          )"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
      - name: Build release
        env:
          DISH_RELEASE_VERSION: ${{ steps.release-version.outputs.label }}
        run: cargo build --release --locked
      - name: Verify the GUI subsystem
        shell: pwsh
        run: |
          # Um binário de console tem subsystem 3; GUI tem 2 (sem janela de console).
          $bytes = [IO.File]::ReadAllBytes('target/release/dish.exe')
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($subsystem -ne 2) { throw "dish.exe uses subsystem $subsystem, expected GUI (2)" }
          Write-Host 'dish.exe is a GUI-subsystem binary (no console window)'
      - name: Sign and verify the executable (opt-in)
        if: github.event_name != 'release' || vars.SIGNPATH_PROJECT_SLUG == ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Path 'target/release/dish.exe'
      # Cada pedido SignPath envia um único arquivo cru, sem ZIP. O EXE precisa
      # voltar assinado antes de ser copiado para o payload de ambos instaladores.
      - name: Upload the executable for SignPath
        id: signpath-exe-upload
        if: github.event_name == 'release' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dish-signpath-unsigned-exe
          path: target/release/dish.exe
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Sign the executable with SignPath
        id: signpath-exe
        if: github.event_name == 'release' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-exe-upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-exe
          skip-decompress: true
      - name: Restore and verify the SignPath executable
        id: signpath-exe-verify
        if: github.event_name == 'release' && vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/signpath-exe" -File -Recurse)
          if ($signed.Count -ne 1) { throw 'Expected exactly one signed executable from SignPath.' }
          Copy-Item -LiteralPath $signed[0].FullName -Destination 'target/release/dish.exe' -Force
          ./scripts/verify-signature.ps1 -Path 'target/release/dish.exe'
      - name: Install NSIS
        shell: pwsh
        run: |
          function Refresh-Path {
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
                        [Environment]::GetEnvironmentVariable('Path', 'User')
          }
          function Find-Makensis {
            $command = Get-Command makensis -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            $candidates = @(
              "$env:ProgramData\chocolatey\bin\makensis.exe",
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            )
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) { return $candidate }
            }
            return $null
          }
          Refresh-Path
          $makensis = Find-Makensis
          # O feed do Chocolatey já respondeu 504 em execução anterior: tenta
          # algumas vezes antes de desistir, e confere se o binário existe.
          for ($attempt = 1; $attempt -le 3 -and -not $makensis; $attempt++) {
            Write-Host "tentativa $attempt de instalar o NSIS"
            choco install nsis --no-progress -y
            Refresh-Path
            $makensis = Find-Makensis
            if (-not $makensis) { Start-Sleep -Seconds 10 }
          }
          if (-not $makensis) {
            Write-Host 'Chocolatey não resolveu; tentando winget'
            winget install --id NSIS.NSIS --silent --accept-package-agreements --accept-source-agreements
            Refresh-Path
            $makensis = Find-Makensis
          }
          if (-not $makensis) { throw 'NSIS não pôde ser instalado (choco e winget falharam)' }
          Write-Host "makensis: $makensis"
          "MAKENSIS=$makensis" >> $env:GITHUB_ENV
      - name: Build the installer and its license bundle
        run: python3 scripts/package-windows.py
      - name: Sign and verify the installer and refresh its checksum (opt-in)
        if: github.event_name != 'release' || vars.SIGNPATH_PROJECT_SLUG == ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Path 'dist/*-windows-x86_64-setup.exe'
      - name: Install WiX
        shell: pwsh
        env:
          # WiX 4 targets .NET 6; allow the supported runtime on the runner.
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          wix --version
          if ($LASTEXITCODE -ne 0) { throw 'WiX version check failed' }
          wix extension add --global WixToolset.UI.wixext/4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension installation failed' }
      - name: Build the MSI installer
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
          MSI_VERSION: ${{ steps.release-version.outputs.numeric }}
          RELEASE_LABEL: ${{ steps.release-version.outputs.label }}
        run: ./scripts/package-msi.ps1 -Version $env:MSI_VERSION -OutputPath "dist/dish-$env:RELEASE_LABEL-windows-x86_64.msi" -SourcePath "$env:RUNNER_TEMP/dish-msi-first/Dish.wxs"
      - name: Verify MSI source determinism
        shell: pwsh
        env:
          MSI_VERSION: ${{ steps.release-version.outputs.numeric }}
        run: |
          $ErrorActionPreference = 'Stop'
          $first = "$env:RUNNER_TEMP/dish-msi-first/Dish.wxs"
          $second = "$env:RUNNER_TEMP/dish-msi-second/Dish.wxs"
          ./scripts/package-msi.ps1 -Version $env:MSI_VERSION -OutputPath "$env:RUNNER_TEMP/dish-msi-second/Dish.msi" -SourcePath $second -GenerateOnly
          $firstHash = (Get-FileHash -LiteralPath $first -Algorithm SHA256).Hash
          $secondHash = (Get-FileHash -LiteralPath $second -Algorithm SHA256).Hash
          if ($firstHash -cne $secondHash) { throw 'MSI source differs between generations (SHA256 mismatch).' }
          $differences = Compare-Object -ReferenceObject ([IO.File]::ReadAllBytes($first)) -DifferenceObject ([IO.File]::ReadAllBytes($second)) -SyncWindow 0
          if ($differences) { throw 'MSI source differs between generations (byte comparison).' }
          Write-Host "Identical MSI sources in separate temporary directories: $firstHash"
      - name: Sign and verify the MSI installer (opt-in)
        if: github.event_name != 'release' || vars.SIGNPATH_PROJECT_SLUG == ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          RELEASE_LABEL: ${{ steps.release-version.outputs.label }}
        run: ./scripts/sign-windows.ps1 -Path "dist/dish-$env:RELEASE_LABEL-windows-x86_64.msi"
      - name: Upload the NSIS installer for SignPath
        id: signpath-nsis-upload
        if: github.event_name == 'release' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dish-signpath-unsigned-nsis
          path: dist/dish-${{ steps.release-version.outputs.label }}-windows-x86_64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Sign the NSIS installer with SignPath
        id: signpath-nsis
        if: github.event_name == 'release' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-nsis-upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-nsis
          skip-decompress: true
      - name: Restore and verify the SignPath NSIS installer and refresh its checksum
        id: signpath-nsis-verify
        if: github.event_name == 'release' && vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ steps.release-version.outputs.label }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/signpath-nsis" -File -Recurse)
          if ($signed.Count -ne 1) { throw 'Expected exactly one signed NSIS installer from SignPath.' }
          Copy-Item -LiteralPath $signed[0].FullName -Destination "dist/dish-$env:RELEASE_LABEL-windows-x86_64-setup.exe" -Force
          ./scripts/verify-signature.ps1 -Path "dist/dish-$env:RELEASE_LABEL-windows-x86_64-setup.exe"
          $file = Get-Item -LiteralPath "dist/dish-$env:RELEASE_LABEL-windows-x86_64-setup.exe" -ErrorAction Stop
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($file.FullName + '.sha256', "$hash  $($file.Name)`n", [Text.UTF8Encoding]::new($false))
      - name: Upload the MSI installer for SignPath
        id: signpath-msi-upload
        if: github.event_name == 'release' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dish-signpath-unsigned-msi
          path: dist/dish-${{ steps.release-version.outputs.label }}-windows-x86_64.msi
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Sign the MSI installer with SignPath
        id: signpath-msi
        if: github.event_name == 'release' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-msi-upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-msi
          skip-decompress: true
      - name: Restore and verify the SignPath MSI installer
        id: signpath-msi-verify
        if: github.event_name == 'release' && vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ steps.release-version.outputs.label }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/signpath-msi" -File -Recurse)
          if ($signed.Count -ne 1) { throw 'Expected exactly one signed MSI installer from SignPath.' }
          Copy-Item -LiteralPath $signed[0].FullName -Destination "dist/dish-$env:RELEASE_LABEL-windows-x86_64.msi" -Force
          ./scripts/verify-signature.ps1 -Path "dist/dish-$env:RELEASE_LABEL-windows-x86_64.msi"
      - name: Checksum the final MSI installer
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ steps.release-version.outputs.label }}
        run: |
          $file = Get-Item -LiteralPath "dist/dish-$env:RELEASE_LABEL-windows-x86_64.msi" -ErrorAction Stop
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($file.FullName + '.sha256', "$hash  $($file.Name)`n", [Text.UTF8Encoding]::new($false))
      - name: Save Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dish-windows-exe
          path: target/release/dish.exe
          if-no-files-found: error
          retention-days: 14
      - name: Save the Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dish-windows-installer
          path: |
            dist/*-windows-x86_64-setup.exe
            dist/*-windows-x86_64-setup.exe.sha256
            dist/*-windows-x86_64.msi
            dist/*-windows-x86_64.msi.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    # Só o evento de Release publica. Push e workflow_dispatch continuam
    # salvando artifacts, para revisão, sem tocar em nenhum Release.
    if: github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # O workflow é somente leitura; escrever no Release é privilégio deste job.
      contents: write
    steps:
      - name: Download the installer built in this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dish-windows-installer
          path: dist-win
      - name: Check that the installer matches the release tag
        run: |
          set -euo pipefail
          installer="$(find dist-win -maxdepth 1 -name 'dish-*-windows-x86_64-setup.exe' -print -quit)"
          if [ -z "$installer" ]; then
            echo 'O artifact não contém o instalador do Windows.' >&2
            exit 1
          fi
          asset="$(basename "$installer")"
          version="${asset#dish-}"
          version="${version%-windows-x86_64-setup.exe}"
          # O rótulo do build vem do ci.yml; o Release precisa ser a tag v<versão>.
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Instalador $version não corresponde ao release $GITHUB_REF_NAME." >&2
            exit 1
          fi
          (cd dist-win && sha256sum -c "$asset.sha256")
          msi="dish-$version-windows-x86_64.msi"
          test -s "dist-win/$msi"
          (cd dist-win && sha256sum -c "$msi.sha256")
          printf 'ASSET=%s\n' "$asset" >> "$GITHUB_ENV"
          printf 'MSI_ASSET=%s\n' "$msi" >> "$GITHUB_ENV"
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Sem --clobber: asset publicado não é substituído (imutabilidade).
          gh release upload "$GITHUB_REF_NAME" "dist-win/$ASSET" "dist-win/$ASSET.sha256" "dist-win/$MSI_ASSET" "dist-win/$MSI_ASSET.sha256"
