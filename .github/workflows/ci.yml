name: Linux CI and candidate package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build and UI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev libegl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers binutils python3 xvfb xauth libxtst6 xclip tesseract-ocr imagemagick fonts-dejavu-core
      - name: Install Rust
        id: rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rust-docs
          echo "version=$(rustc --version | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-v1-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-v1-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check
        run: cargo check --locked
      - name: Unit tests
        run: cargo test --locked
      - name: Clippy (no warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release tooling tests
        run: python3 -m unittest discover -s tests -p 'test_release_package.py' -v
      - name: Build and package candidate (with path remapping and license checks)
        run: python3 scripts/package-linux.py --version 0.1.0-alpha.2
      - name: Build Debian package from the verified candidate
        run: python3 scripts/package-deb.py --version 0.1.0-alpha.2
      - name: Test the real archive, installation and packaged executable
        run: |
          export DISH_TEST_ARCHIVE="$(realpath dist/dish-*-linux-x86_64.tar.gz)"
          python3 -m unittest discover -s tests -p 'test_release_package.py' -v
          mkdir -p /tmp/dish-candidate
          tar -xzf dist/dish-*-linux-x86_64.tar.gz -C /tmp/dish-candidate
          export DISH_TEST_BIN="$(find /tmp/dish-candidate -path '*/bin/dish' -type f)"
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          test -n "$DISH_TEST_BIN"
          xvfb-run -a -s '-screen 0 1280x960x24' python3 tests/desktop_smoke.py
          xvfb-run -a -s '-screen 0 1280x960x24' python3 tests/startup_smoke.py
          xvfb-run -a -s '-screen 0 1280x960x24' python3 tests/settings_smoke.py
          xvfb-run -a -s '-screen 0 1280x960x24' python3 tests/session_activity_smoke.py
      - name: Install the Debian package and smoke-test /usr/bin/dish
        run: |
          sudo apt-get install -y ./dist/dish_*_amd64.deb
          test -x /usr/bin/dish
          test -f /usr/share/applications/dish.desktop
          dpkg-query -W -f='${Package} ${Version} ${Status}\n' dish
          export DISH_TEST_BIN=/usr/bin/dish LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1280x960x24' python3 tests/desktop_smoke.py
          sudo apt-get remove -y dish
          test ! -e /usr/bin/dish
      - name: Save synthetic UI failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-ui-failure-screenshots
          path: /tmp/dish-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Save Rust build cache, including failed test runs
        if: always() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Save candidate package (not a GitHub Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dish-linux-x86_64-candidate
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
