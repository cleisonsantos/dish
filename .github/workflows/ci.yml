name: Linux CI and candidate package

on:
  # PRs run once through pull_request; pushes to main publish the candidate.
  # Branch pushes used to trigger both events and duplicate every run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast, blocking feedback: no GUI, no package build.
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev libegl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers binutils python3 nodejs
      - name: Install Rust
        id: rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rust-docs
          echo "version=$(rustc --version | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-v1-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-v1-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check
        run: cargo check --locked
      - name: Unit tests
        run: cargo test --locked
      - name: Clippy (no warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: UI observation and OCR helper tests
        run: python3 -m unittest discover -s tests -p 'test_ui_test_support.py' -v
      - name: Release tooling tests
        run: python3 -m unittest discover -s tests -p 'test_release_package.py' -v
      - name: Provider adapter contract
        # Rodam contra o SDK falso: sem Pi, sem rede e sem credencial real.
        run: |
          python3 -m unittest discover -s tests -p 'test_provider_adapter.py' -v
          python3 -m unittest discover -s tests -p 'test_provider_login.py' -v
      - name: Save Rust build cache, including failed test runs
        if: always() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  # Blocking package gate. Builds the release once; the UI jobs consume the
  # verified .deb instead of rebuilding the binary.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev libegl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers binutils python3
      - name: Install Rust
        id: rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rust-docs
          echo "version=$(rustc --version | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-package-v1-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-package-v1-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            linux-v1-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build and package candidate (with path remapping and license checks)
        run: python3 scripts/package-linux.py --version 0.1.0-beta.1
      - name: Build Debian package from the verified candidate
        run: python3 scripts/package-deb.py --version 0.1.0-beta.1
      - name: Test the real archive and package metadata
        run: |
          export DISH_TEST_ARCHIVE="$(realpath dist/dish-*-linux-x86_64.tar.gz)"
          python3 -m unittest discover -s tests -p 'test_release_package.py' -v
      - name: Install the Debian package and check coexistence with the Debian dish
        run: |
          # Simula o pacote `dish` do Debian, que instala /usr/bin/dish: o nosso
          # pacote não pode removê-lo, substituí-lo nem disputar o caminho.
          fake="$(mktemp -d)"
          mkdir -p "$fake/DEBIAN" "$fake/usr/bin"
          printf 'Package: dish\nVersion: 1.19.1-2\nArchitecture: amd64\nMaintainer: Debian QA <qa@example.invalid>\nDescription: fake Debian dish for the coexistence test\n' > "$fake/DEBIAN/control"
          printf '#!/bin/sh\necho debian-dish\n' > "$fake/usr/bin/dish"
          chmod 755 "$fake/usr/bin/dish"
          dpkg-deb --build --root-owner-group "$fake" "$fake/dish.deb"
          sudo dpkg -i "$fake/dish.deb"
          debian_dish="$(sha256sum /usr/bin/dish)"
          sudo apt-get install -y ./dist/dish-pi_*_amd64.deb
          test -x /usr/bin/dish-pi
          test -f /usr/share/applications/dish-pi.desktop
          dpkg-query -W -f='${Package} ${Version} ${Status}\n' dish-pi
          dpkg-query -W -f='${Package} ${Version} ${Status}\n' dish
          # Coexistência: o binário do Debian continua o mesmo, o nosso é
          # registrado como nosso e /usr/bin/dish não pertence ao dish-pi.
          test "$debian_dish" = "$(sha256sum /usr/bin/dish)"
          dpkg-query -S /usr/bin/dish-pi | grep -q '^dish-pi'
          ! dpkg-query -S /usr/bin/dish 2>/dev/null | grep -q '^dish-pi'
          # Remover o nosso não toca no pacote do Debian.
          sudo apt-get remove -y dish-pi
          test ! -e /usr/bin/dish-pi
          test -x /usr/bin/dish
          sudo dpkg -r dish
          test ! -e /usr/bin/dish
      - name: Save candidate package (not a GitHub Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dish-linux-x86_64-candidate
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Save Rust build cache, including failed test runs
        if: always() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  # Only these three smokes block a merge. They run against the installed
  # package, so an archive/install regression cannot hide behind a local build.
  ui:
    needs: [fast, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the verified candidate package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dish-linux-x86_64-candidate
          path: dist
      - name: Install UI dependencies and the built Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libxtst6 xclip tesseract-ocr imagemagick fonts-dejavu-core python3 libegl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          deb="$(find dist -name 'dish-pi_*_amd64.deb' -type f -print -quit)"
          test -n "$deb"
          sudo apt-get install -y "./$deb"
          test -x /usr/bin/dish-pi
          echo "DISH_TEST_BIN=/usr/bin/dish-pi" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          runtime="$(mktemp -d)"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Essential UI smokes (blocking)
        run: bash tests/run_ui.sh tests/startup_smoke.py tests/desktop_smoke.py tests/settings_smoke.py
      - name: Save synthetic UI failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-ui-essential-failure
          path: |
            /tmp/dish-*.png
            /tmp/dish-*-ui-*.jsonl
          if-no-files-found: ignore
          retention-days: 3

  # Informative coverage: same package, all remaining smokes. The job is
  # allowed to fail, so it never blocks the merge but still reports on every PR.
  ui-informational:
    needs: [fast, package]
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the verified candidate package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dish-linux-x86_64-candidate
          path: dist
      - name: Install UI dependencies and the built Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libxtst6 xclip tesseract-ocr imagemagick fonts-dejavu-core python3 libegl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          deb="$(find dist -name 'dish-pi_*_amd64.deb' -type f -print -quit)"
          test -n "$deb"
          sudo apt-get install -y "./$deb"
          test -x /usr/bin/dish-pi
          echo "DISH_TEST_BIN=/usr/bin/dish-pi" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          runtime="$(mktemp -d)"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Informative UI smokes (non-blocking)
        id: smokes
        run: bash tests/run_ui.sh tests/search_stability_smoke.py tests/providers_smoke.py tests/session_titles_smoke.py tests/model_effort_smoke.py tests/session_activity_smoke.py tests/appearance_smoke.py tests/project_folder_smoke.py tests/pinned_sessions_smoke.py tests/diagnostic_privacy_smoke.py tests/notifications_smoke.py
      - name: Save synthetic UI failure screenshots
        if: always() && steps.smokes.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-ui-informational-failure
          path: |
            /tmp/dish-*.png
            /tmp/dish-*-ui-*.jsonl
          if-no-files-found: ignore
          retention-days: 3
